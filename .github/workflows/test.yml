name: Tests

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test -- --coverage --maxWorkers=2

      - name: Generate coverage badges (overall, server API, client UI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes coverage-badges-cli --source coverage/coverage-summary.json --output coverage/coverage.svg --style flat
          node scripts/coverage-badges.js

      # Pushes made with GITHUB_TOKEN don't trigger further workflow runs,
      # so publishing the badges can't loop back into this workflow.
      - name: Publish badges to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd coverage
          git init -q -b badges
          git add coverage.svg server-api.svg client-ui.svg
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Update coverage badges"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
