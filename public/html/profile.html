<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyConnect | Profile</title>
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body class="student-app">
    <header>
      <nav aria-label="Main navigation">
        <a href="StudentView.html">Dashboard</a>
        <a href="my-sessions.html">My Sessions</a>
        <a href="profile.html" aria-current="page">Profile</a>
        <a href="#" id="logout-button">Logout</a>
      </nav>
    </header>

    <main>
      <section aria-labelledby="page-heading">
        <h2 id="page-heading">Profile</h2>
        <p>Your info and the subjects you can help with.</p>
      </section>

      <section aria-labelledby="profile-heading" class="card">
        <header>
          <h2 id="profile-heading">Your details</h2>
        </header>

        <form id="profileForm" class="form-grid">
          <div class="form-field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required />
          </div>

          <div class="form-field">
            <label for="yearOfStudy">Year of study</label>
            <input type="text" id="yearOfStudy" placeholder="e.g. 2nd year" />
          </div>

          <div class="form-field full-width">
            <label>Subjects you can help with</label>
            <div class="checkbox-row">
              <label
                ><input type="checkbox" name="subject" value="Mathematics" />
                Mathematics</label
              >
              <label
                ><input type="checkbox" name="subject" value="Science" />
                Science</label
              >
              <label
                ><input type="checkbox" name="subject" value="English" />
                English</label
              >
              <label
                ><input
                  type="checkbox"
                  name="subject"
                  value="Computer Science"
                />
                Computer Science</label
              >
            </div>
          </div>

          <div class="form-field full-width">
            <label for="bio">About you</label>
            <textarea
              id="bio"
              rows="3"
              placeholder="A short note students will see"
            ></textarea>
          </div>

          <div class="form-actions full-width">
            <button type="submit">Save profile</button>
          </div>
        </form>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/profile.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>
