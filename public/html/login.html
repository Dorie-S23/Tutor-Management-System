<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyConnect | Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <span class="brand">StudyConnect</span>
    </header>

    <main class="auth-main">
        <div class="card auth-card">
            <h2>Welcome back</h2>
            <p class="card-hint">Sign in to access your account.</p>

            <p id="login-message" class="form-error" hidden></p>

            <form id="login-form">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>

            <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
