<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyConnect | My Sessions</title>
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body class="student-app">
    <header class="board-header board-header--brand">
      <hgroup class="header-left">
        <p class="eyebrow">
          <img src="../images/images.png" alt="" class="eyebrow-logo" />
          School of Computer Science &amp; Applied Mathematics
        </p>
        <h1 id="welcome-heading">Welcome!</h1>
      </hgroup>

      <img
        src="../images/Wits-890x664.png"
        alt="University of the Witwatersrand"
        class="header-wits-logo"
      />

      <div class="header-actions">
        <a class="btn btn-ghost" href="my-sessions.html" aria-current="page"
          >My Sessions</a
        >
        <a class="btn btn-ghost" href="student-log-hours.html">Log Hours</a>
        <a class="btn btn-ghost" href="student-calendar.html">Calendar</a>
        <a class="btn btn-ghost" href="StudentView.html">Take the tour</a>
        <div class="notif-bell" id="notifBell">
          <button
            type="button"
            id="notifBellBtn"
            class="notif-bell-btn"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Notifications"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notif-bell-badge" id="notifBellBadge" hidden>0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" hidden>
            <div class="notif-dropdown-head">
              <span>Notifications</span>
              <button
                type="button"
                id="notifMarkAllBtn"
                class="notif-mark-all-btn"
              >
                Mark all read
              </button>
            </div>
            <ul class="notif-list" id="notifList"></ul>
            <p class="notif-empty" id="notifEmpty" hidden>
              No notifications yet.
            </p>
          </div>
        </div>
      </div>
      <button class="btn btn-danger" id="logout-button" type="button">
        Logout
      </button>
    </header>

    <main>
      <section aria-labelledby="page-heading">
        <h2 id="page-heading">My Sessions</h2>
        <p>Everything you've volunteered for, upcoming and past.</p>
      </section>

      <section aria-labelledby="upcoming-heading" class="card">
        <header>
          <h2 id="upcoming-heading">Upcoming</h2>
        </header>
        <div id="upcomingList" class="session-list"></div>
      </section>

      <section aria-labelledby="past-heading" class="card">
        <header>
          <h2 id="past-heading">Past Sessions</h2>
        </header>
        <div id="pastList" class="session-list"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/my-sessions.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>
