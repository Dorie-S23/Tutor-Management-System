<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timesheet Review | Tutor Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <header class="board-header">
      <hgroup class="header-left">
        <p class="eyebrow">
          <img src="../images/images.png" alt="" class="eyebrow-logo" />
          School of Computer Science &amp; Applied Mathematics
        </p>
        <h1>Timesheet Review</h1>
      </hgroup>

      <img
        src="../images/Wits-890x664.png"
        alt="University of the Witwatersrand"
        class="header-wits-logo"
      />

      <div class="header-actions">
        <a class="btn btn-ghost" href="board.html">&larr; Allocation board</a>
      </div>
      <button class="btn btn-danger" id="logout-button" type="button">
        Logout
      </button>
    </header>

    <main class="board-layout timesheet-review-layout">
      <section class="detail-pane" aria-label="Timesheet submissions">
        <section class="assign-panel" aria-labelledby="submissionsHeading">
          <header class="assign-panel-head">
            <h3 id="submissionsHeading">Submitted timesheets</h3>
            <select id="statusFilter" aria-label="Filter by status">
              <option value="pending" selected>Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="">All</option>
            </select>
          </header>

          <ul class="tutor-list" id="submissionList">
            <!-- injected -->
          </ul>
          <p class="empty-copy" id="submissionsEmpty" hidden>
            No timesheets to show for this filter.
          </p>
        </section>
      </section>
    </main>

    <output class="toast" id="toast" role="status" aria-live="polite"></output>

    <script src="../js/timesheet-review.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>
