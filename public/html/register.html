<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyConnect | Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <span class="brand">StudyConnect</span>
    </header>

    <main class="auth-main">
        <div class="card auth-card">
            <h2>Create your account</h2>
            <p class="card-hint">Register to get started.</p>

            <p id="register-message" class="form-error" hidden></p>

            <form id="register-form">
                <div class="form-field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-field">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Enter your password again" required>
                </div>
                <div class="form-field">
                    <label for="role">Account type</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student</option>
                        <option value="tutor">Tutor</option>
                        <option value="organiser">Organiser</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Create account</button>
                </div>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Back to login</a></p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
