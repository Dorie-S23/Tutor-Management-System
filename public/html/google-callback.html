<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Signing in | TutorX</title>

    <!-- Fonts used by the auth pages -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Design tokens, base typography and the shared card shell -->

    <link rel="stylesheet" href="../css/auth-global.css" />

    <script src="../js/theme.js"></script>
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card">
        <header class="auth-header">
          <span class="eyebrow">TutorX</span>

          <h1>Signing you in...</h1>
        </header>

        <div class="auth-progress" id="callback-progress">
          <span class="auth-spinner" aria-hidden="true"></span>

          <p id="status" class="form-message" aria-live="polite">
            Please wait while we complete your Google login.
          </p>
        </div>
      </section>
    </main>

    <!-- Supabase JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://bdwyjepbxwoitdwbdlir.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkd3lqZXBieHdvaXRkd2JkbGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTUxNDQsImV4cCI6MjEwMTQ3MTE0NH0.xCpleg_YveDZf-ilAcudkuf0vsvOROFfQUQHpMssmzc";

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      const status = document.getElementById("status");

      const progress = document.getElementById("callback-progress");

      /*
       * Mirrors auth.js setMessage — toggles the state classes that
       * colour the shared .form-message element (see auth-global.css)
       * and stops the spinner once the flow reaches a terminal state.
       */

      function setStatus(text, kind) {
        status.textContent = text;

        status.classList.toggle("is-error", kind === "error");

        status.classList.toggle("is-success", kind === "success");

        progress.classList.toggle("is-done", Boolean(kind));
      }

      /*
       * Every failure ends here: the message is shown on this page in
       * case navigation is slow or blocked, then the person is sent back
       * to login.html with the reason in ?authError= (consumed by
       * public/js/auth.js) so they're never stranded on this spinner.
       */

      function failBackToLogin(message) {
        setStatus(message, "error");

        const params = new URLSearchParams({ authError: message });

        window.location.href = `/html/login.html?${params.toString()}`;
      }

      /*
       * Map a user's role to the page they should
       * land on, matching the routes used by
       * public/js/auth.js's password-login flow.
       */

      function redirectPathForRole(role) {
        switch (role) {
          // Legacy accounts created before the Volunteer rename.
          case "student":
          case "volunteer":
            return "/html/StudentView.html";

          case "tutor":
            return "/html/dashboard.html";

          case "educator":
            return "/html/educator.html";

          case "organiser":
          case "super_organiser":
            return "/html/board.html";

          default:
            return "/html/login.html";
        }
      }

      async function handleGoogleCallback() {
        try {
          /*
           * =================================================
           * STEP 1
           * Check whether Supabase gave us an OAuth code
           * =================================================
           */

          const params = new URLSearchParams(window.location.search);

          const code = params.get("code");

          /*
           * =================================================
           * STEP 2
           * Exchange the OAuth code for a Supabase session
           * =================================================
           */

          if (code) {
            setStatus("Completing Google sign-in...");

            const { error } =
              await supabaseClient.auth.exchangeCodeForSession(code);

            if (error) {
              console.error("Code exchange error:", error);

              failBackToLogin("Could not complete Google sign-in.");

              return;
            }
          }

          /*
           * =================================================
           * STEP 3
           * Get the newly-created session
           * =================================================
           */

          const { data, error } = await supabaseClient.auth.getSession();

          if (error) {
            console.error("Session error:", error);

            failBackToLogin("Could not retrieve your login session.");

            return;
          }

          const session = data.session;

          /*
           * =================================================
           * STEP 4
           * Make sure we actually have a user
           * =================================================
           */

          if (!session || !session.user) {
            console.error("No Supabase session found.");

            failBackToLogin("No authenticated user was found.");

            return;
          }

          const user = session.user;

          console.log("Authenticated Google user:", user);

          /*
           * =================================================
           * STEP 5
           * Check whether user already exists in users table
           * =================================================
           */

          const { data: profile, error: profileError } = await supabaseClient
            .from("users")
            .select("id, name, role")
            .eq("id", user.id)
            .maybeSingle();

          if (profileError) {
            console.error("Profile lookup error:", profileError);

            failBackToLogin("Could not check your account.");

            return;
          }

          /*
           * =================================================
           * STEP 6
           * NEW USER
           *
           * Google authentication succeeded, but the user
           * isn't in our users table.
           * =================================================
           */

          if (!profile) {
            console.log("New Google user detected.");

            setStatus("Setting up your account...");

            /*
             * Store information needed by
             * google-register.html
             */

            sessionStorage.setItem("googleUserId", user.id);

            sessionStorage.setItem("googleEmail", user.email);

            sessionStorage.setItem(
              "googleName",
              user.user_metadata?.full_name || user.user_metadata?.name || "",
            );

            /*
             * IMPORTANT:
             * Store the access token so that
             * google-register.html can send it
             * to your backend.
             */

            sessionStorage.setItem("googleAccessToken", session.access_token);

            /*
             * Go to Google account setup.
             */

            window.location.href = "/html/google-register.html";

            return;
          }

          /*
           * =================================================
           * STEP 7
           * EXISTING USER
           * =================================================
           */

          console.log("Existing user detected:", profile);

          /*
           * =================================================
           * STEP 8
           * ORGANISER APPROVAL GATE
           *
           * Mirrors POST /api/auth/login: a pending or
           * denied request blocks sign-in; an approved
           * request carries the course access the board
           * filters on; legacy organisers (no request
           * rows) keep full access.
           * =================================================
           */

          const profileRole =
            profile.role === "student" ? "volunteer" : profile.role;

          let courseIds;

          if (profileRole === "organiser") {
            const { data: requestRows, error: requestsError } =
              await supabaseClient
                .from("organiser_requests")
                .select("course_id, status")
                .eq("user_id", user.id);

            if (requestsError) {
              console.error("Organiser request lookup error:", requestsError);

              failBackToLogin("Could not check your organiser request.");

              return;
            }

            const rows = requestRows || [];

            if (rows.length > 0) {
              const approved = rows.filter((row) => row.status === "approved");

              if (approved.length > 0) {
                courseIds = approved.map((row) => row.course_id);
              } else {
                await supabaseClient.auth.signOut();

                failBackToLogin(
                  rows.some((row) => row.status === "pending")
                    ? "Your organiser request is still awaiting approval — you can sign in once the super-organiser approves it."
                    : "Your organiser request was denied.",
                );

                return;
              }
            }
          }

          setStatus("Login successful. Redirecting...", "success");

          /*
           * Store the logged-in user's information the
           * same way public/js/auth.js does for password
           * logins, so pages that read sessionStorage's
           * "user" key (see storage.js's getCurrentUser)
           * recognize this session too.
           */

          sessionStorage.setItem("access_token", session.access_token);

          sessionStorage.setItem(
            "user",
            JSON.stringify({
              id: user.id,
              email: user.email,
              name: profile.name,
              // Legacy "student" profiles are reported as "volunteer".
              role: profileRole,
              // Approved courses an organiser is limited to — absent
              // for legacy organisers, who keep full access.
              ...(courseIds ? { courseIds } : {}),
            }),
          );

          /*
           * Existing users go to the page matching
           * their role.
           */

          window.location.href = redirectPathForRole(profileRole);
        } catch (error) {
          console.error("Google callback error:", error);

          failBackToLogin("An unexpected error occurred.");
        }
      }

      /*
       * Start processing callback
       */

      handleGoogleCallback();
    </script>
  </body>
</html>
