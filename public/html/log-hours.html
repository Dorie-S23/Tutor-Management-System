<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyConnect | Log Hours</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <nav aria-label="Main navigation">
            <a href="StudentView.html">Dashboard</a>
            <a href="my-sessions.html">My Sessions</a>
            <a href="log-hours.html" aria-current="page">Log Hours</a>
            <a href="calendar.html">Calendar</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logout-button">Logout</a>
        </nav>
    </header>

  <main>
    <div class="card">
      <h2 id="form-title">Log hours</h2>
      <p id="form-error" class="form-error" hidden></p>
      <form id="entry-form">
        <input type="hidden" id="entry-id" />
        <div class="form-grid">
          <div class="form-field">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-field">
            <label for="hours">Hours worked</label>
            <input type="number" id="hours" min="1" max="24" step="1" required />
          </div>
          <div class="form-field">
            <label for="startTime">Start time</label>
            <input type="time" id="startTime" />
          </div>
          <div class="form-field">
            <label for="endTime">End time</label>
            <input type="time" id="endTime" />
          </div>
          <div class="form-field">
            <label for="taskType">Task type</label>
            <select id="taskType">
              <option value="Tutoring">Tutoring</option>
              <option value="Marking">Marking</option>
              <option value="Invigilation">Invigilation</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div class="form-field">
            <label for="subject">Course code</label>
            <input type="text" id="subject" placeholder="e.g. COMS1015A" />
          </div>
          <div class="form-field full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="2" placeholder="Optional"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn-primary">Add entry</button>
            <button type="button" id="cancel-edit-btn" class="btn-secondary" hidden>Cancel</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="week-nav">
        <button type="button" id="prev-week-btn" class="btn-secondary">&larr; Prev week</button>
        <span class="week-label" id="week-label"></span>
        <button type="button" id="next-week-btn" class="btn-secondary">Next week &rarr;</button>
      </div>
      <p class="week-total">Total this week: <strong id="week-total">0</strong> hours</p>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Hours</th>
            <th>Task type</th>
            <th>Course code</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
      <p id="empty-state" class="empty-state" hidden>No entries logged for this week yet.</p>
    </div>
  </main>

  <script type="module" src="../js/log-hours.js"></script>
  <script src="../js/logout.js"></script>
</body>
</html>
