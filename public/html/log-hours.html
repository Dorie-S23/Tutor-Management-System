<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Hours | Tutor Management System</title>
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body class="tutor-app">
    <header class="app-header">
      <h1>Log Hours</h1>
      <nav class="tab-nav">
        <a href="dashboard.html" id="dashboard-nav-link">Dashboard</a>
        <a href="my-sessions.html" id="my-sessions-nav-link">My Sessions</a>
        <a href="log-hours.html" aria-current="page">Log Hours</a>
        <a href="calendar.html" id="calendar-nav-link">Calendar</a>
        <a href="timesheets.html" id="timesheets-nav-link">Timesheets</a>
        <a href="modules.html" id="modules-nav-link">Module Application</a>
        <div class="notif-bell" id="notifBell">
          <button
            type="button"
            id="notifBellBtn"
            class="notif-bell-btn"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Notifications"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notif-bell-badge" id="notifBellBadge" hidden>0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" hidden>
            <div class="notif-dropdown-head">
              <span>Notifications</span>
              <button
                type="button"
                id="notifMarkAllBtn"
                class="notif-mark-all-btn"
              >
                Mark all read
              </button>
            </div>
            <ul class="notif-list" id="notifList"></ul>
            <p class="notif-empty" id="notifEmpty" hidden>
              No notifications yet.
            </p>
          </div>
        </div>
        <a href="#" id="logout-button">Logout</a>
      </nav>
    </header>

    <main>
      <div class="card">
        <h2 id="form-title">Log hours</h2>
        <form id="entry-form">
          <input type="hidden" id="entry-id" />
          <input type="hidden" id="hours" />
          <div class="form-grid">
            <div class="form-field">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-field">
              <label for="taskType">Task type</label>
              <select id="taskType" required>
                <option value="Tutoring">Tutoring</option>
                <option value="Marking">Marking</option>
                <option value="Invigilation">Invigilation</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <div class="form-field">
              <label for="startTime">Start time</label>
              <input type="time" id="startTime" required />
            </div>
            <div class="form-field">
              <label for="endTime">End time</label>
              <input type="time" id="endTime" required />
            </div>
            <p id="form-error" class="form-error full-width" hidden></p>
            <div class="form-field">
              <label for="subject">Course code</label>
              <input
                type="text"
                id="subject"
                placeholder="e.g. COMS1015A"
                required
              />
            </div>
            <div class="form-field">
              <label for="courseSelect">Course (for budget report)</label>
              <select id="courseSelect">
                <option value="">No specific course</option>
              </select>
            </div>
            <div class="form-field">
              <label>Hours worked</label>
              <p
                class="hours-readout"
                id="hours-display"
                title="Calculated from start/end time, rounded to the nearest whole hour"
              >
                —
              </p>
            </div>
            <div class="form-field full-width">
              <label for="notes">Notes</label>
              <textarea id="notes" rows="2" placeholder="Optional"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn-primary">
              Add entry
            </button>
            <button
              type="button"
              id="cancel-edit-btn"
              class="btn-secondary"
              hidden
            >
              Cancel
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="week-nav">
          <button type="button" id="prev-week-btn" class="btn-secondary">
            &larr; Prev week
          </button>
          <span class="week-label" id="week-label"></span>
          <button type="button" id="next-week-btn" class="btn-secondary">
            Next week &rarr;
          </button>
        </div>
        <p class="week-total">
          Total this week: <strong id="week-total">0</strong> hours
        </p>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Hours</th>
              <th>Task type</th>
              <th>Course code</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entries-body"></tbody>
        </table>
        <p id="empty-state" class="empty-state" hidden>
          No entries logged for this week yet.
        </p>
      </div>
    </main>

    <dialog
      class="modal"
      id="confirm-modal"
      aria-labelledby="confirm-modal-heading"
    >
      <div class="modal-form">
        <header class="modal-head">
          <h2 id="confirm-modal-heading">Are you sure?</h2>
        </header>
        <p id="confirm-modal-message"></p>
        <menu class="modal-actions">
          <li>
            <button
              class="btn-secondary"
              id="confirm-modal-cancel-btn"
              type="button"
            >
              Cancel
            </button>
          </li>
          <li>
            <button
              class="btn-danger"
              id="confirm-modal-confirm-btn"
              type="button"
            >
              Confirm
            </button>
          </li>
        </menu>
      </div>
    </dialog>

    <output class="toast" id="toast" role="status" aria-live="polite"></output>

    <script type="module" src="../js/log-hours.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>
