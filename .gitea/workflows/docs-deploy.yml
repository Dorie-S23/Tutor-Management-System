name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "my-docs/**"

jobs:
  deploy-docs:
    runs-on: dorsa-temp-runner
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: my-docs
      - run: npm run build
        working-directory: my-docs
      - run: npx wrangler deploy
        working-directory: my-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
