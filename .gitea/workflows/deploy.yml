name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Keep the worker's third-party API secrets synced from repo secrets so
      # the keys never live in git. Each name is skipped quietly when the
      # matching repo secret isn't set, so this stays a no-op on a fresh clone
      # until the secrets are added under the repo's Settings -> Secrets.
      # Node (not bash) so it runs on the Windows runners too.
      - run: >-
          node -e "const{spawnSync}=require('child_process');
          for(const n of ['GEMINI_API_KEY','RESEND_API_KEY']){
          const k=process.env[n];
          if(!k){console.log(n+' repo secret not set - skipping.');continue;}
          const
          r=spawnSync('npx',['wrangler','secret','put',n],
          {input:k,stdio:['pipe','inherit','inherit'],shell:process.platform==='win32'});
          if(r.status==null)process.exit(1);
          if(r.status!==0)process.exit(r.status);}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
