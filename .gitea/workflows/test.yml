name: Tests

on: [push]

permissions:
  contents: write

jobs:
  test:
    runs-on: dorsa-temp-runner
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test -- --coverage --maxWorkers=2

      - name: Generate coverage badges (overall, server API, client UI)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/coverage/integrate-code-coverage'
        run: |
          npx --yes coverage-badges-cli --source coverage/coverage-summary.json --output coverage/coverage.svg --style flat
          node scripts/coverage-badges.js

      - name: Publish badges to badges branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/coverage/integrate-code-coverage'
        run: |
          cd coverage
          git init -q -b badges
          git add coverage.svg server-api.svg client-ui.svg
          git -c user.name=gitea-actions -c user.email=actions@local commit -qm "Update coverage badges"
          git push -q --force "https://${{ secrets.GITEA_TOKEN }}@sdp.ms.wits.ac.za/the-devden/Tutor-Management-System.git" badges
