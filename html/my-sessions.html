<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyConnect | My Sessions</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <nav aria-label="Main navigation">
            <a href="StudentView.html">Dashboard</a>
            <a href="my-sessions.html" aria-current="page">My Sessions</a>
            <a href="#">Find Students</a>
            <a href="#">Messages</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="page-heading">
            <h2 id="page-heading">My Sessions</h2>
            <p>Everything you've volunteered for, upcoming and past.</p>
        </section>

        <section aria-labelledby="upcoming-heading" class="card">
            <header>
                <h2 id="upcoming-heading">Upcoming</h2>
            </header>
            <div id="upcomingList" class="session-list"></div>
        </section>

        <section aria-labelledby="past-heading" class="card">
            <header>
                <h2 id="past-heading">Past Sessions</h2>
            </header>
            <div id="pastList" class="session-list"></div>
        </section>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/session-data.js"></script>
    <script src="../js/my-sessions.js"></script>
</body>
</html>
